<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GS PHERIUM - Custom Printing & Branding Solutions Dubai</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    
    body { 
      background-color: #121214; 
      background-image: 
        radial-gradient(circle at 50% 20%, #222226 0%, #111113 70%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
      color: #e2e8f0; 
      overflow-x: hidden; 
    }

    /* --- SPLASH SCREEN --- */
    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0d0d0f; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 99999;
      transition: opacity 0.6s ease, visibility 0.6s; text-align: center; padding: 20px;
    }
    .splash-logo-container {
      background: #ffffff; padding: 15px 30px; border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      animation: zoomIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .splash-logo-img { max-width: 260px; width: 80%; height: auto; display: block; }
    .sub-tagline { color: #a1a1aa; font-size: 1.05rem; margin-top: 20px; font-weight: 400; }
    .enter-btn-container { margin-top: 30px; }
    .enter-btn {
      background: linear-gradient(135deg, #27272a 0%, #18181b 100%);
      color: #ffffff; padding: 14px 32px; border-radius: 30px; font-weight: 600; font-size: 0.9rem;
      letter-spacing: 2px; cursor: pointer; border: 1px solid #3f3f46; display: inline-flex;
      align-items: center; gap: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.6); transition: all 0.3s ease;
    }
    .enter-btn:hover { border-color: #71717a; transform: translateY(-2px); }

    @keyframes zoomIn { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* --- FLOATING CONTACT WIDGET --- */
    .floating-contact {
      position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 12px; z-index: 1000;
      background: rgba(24, 24, 27, 0.85); padding: 16px 10px; border-radius: 30px;
      border: 1px solid #27272a; backdrop-filter: blur(8px); text-align: center;
    }
    .floating-contact span { font-size: 0.65rem; color: #71717a; writing-mode: vertical-rl; transform: rotate(180deg); }
    .floating-btn { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.2rem; text-decoration: none; transition: transform 0.3s; }
    .floating-btn:hover { transform: scale(1.15); }
    .wa-btn { background: #25d366; }
    .mail-btn { background: #ea4335; }

    /* --- HEADER --- */
    header { padding: 40px 20px 30px; text-align: center; background: #18181b; border-bottom: 1px solid #27272a; }
    .header-logo-container { display: inline-block; cursor: pointer; }
    .header-logo-badge { background: #ffffff; padding: 12px 28px; border-radius: 12px; display: inline-block; margin-bottom: 15px; border: 1px solid #e4e4e7; }
    .header-logo-img { height: 60px; width: auto; display: block; }
    header h1 { font-size: 2.2rem; color: #f4f4f5; letter-spacing: 3px; font-weight: 700; }
    header p { color: #a1a1aa; font-size: 0.95rem; margin-top: 6px; }

    /* --- SERVICES GRID --- */
    .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
    .card { background: #18181b; border-radius: 14px; overflow: hidden; border: 1px solid #27272a; transition: all 0.3s ease; cursor: pointer; }
    .card:hover { transform: translateY(-8px); border-color: #52525b; }
    .card img { width: 100%; height: 210px; object-fit: cover; }
    .card-body { padding: 22px; }
    .card-body h3 { font-size: 1.1rem; color: #f4f4f5; margin-bottom: 8px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .card-body p { font-size: 0.85rem; color: #a1a1aa; line-height: 1.6; }
    .card-click-badge { font-size: 0.75rem; color: #38bdf8; font-weight: 500; margin-top: 12px; display: inline-flex; align-items: center; gap: 5px; }

    /* --- DETAIL POPUP MODALS --- */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(9, 9, 11, 0.92); backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: center;
      z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-card {
      background: #18181b; width: 92%; max-width: 700px; max-height: 88vh; overflow-y: auto;
      border-radius: 16px; border: 1px solid #3f3f46; padding: 30px; text-align: left; position: relative;
    }
    .modal-close { position: absolute; top: 15px; right: 20px; font-size: 1.6rem; color: #a1a1aa; cursor: pointer; }
    .modal-card h2 { color: #f4f4f5; font-size: 1.5rem; margin-bottom: 10px; border-bottom: 1px solid #27272a; padding-bottom: 10px; }
    .modal-card p.desc { color: #a1a1aa; font-size: 0.9rem; margin-bottom: 20px; }
    
    .quality-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 25px; }
    .quality-item { 
      background: #09090b; padding: 16px; border-radius: 12px; border: 1px solid #27272a;
      display: flex; gap: 16px; align-items: center; cursor: pointer;
    }
    .quality-item-img-wrap { position: relative; flex-shrink: 0; }
    .quality-item img {
      width: 110px; height: 85px; object-fit: cover; border-radius: 8px; border: 1px solid #3f3f46;
      transition: transform 0.2s, border-color 0.2s;
    }
    .quality-item:hover img { transform: scale(1.05); border-color: #38bdf8; }
    .expand-hint {
      position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.7);
      color: #fff; font-size: 0.6rem; padding: 2px 4px; border-radius: 4px; pointer-events: none;
    }
    .quality-item-text strong { color: #38bdf8; font-size: 0.95rem; display: block; margin-bottom: 4px; }
    .quality-item-text span { color: #d4d4d8; font-size: 0.85rem; line-height: 1.5; display: block; }

    /* --- FULL SCREEN LIGHTBOX --- */
    #image-lightbox {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.95); z-index: 20000; display: flex;
      flex-direction: column; justify-content: center; align-items: center;
      opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s;
      padding: 20px; cursor: pointer;
    }
    #image-lightbox.active { opacity: 1; visibility: visible; }
    #image-lightbox img {
      max-width: 95%; max-height: 85vh; object-fit: contain;
      border-radius: 8px; box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
    }
    #image-lightbox .lightbox-caption {
      color: #f4f4f5; margin-top: 15px; font-size: 1rem; font-weight: 500; text-align: center;
    }
    #image-lightbox .lightbox-exit-tip {
      color: #38bdf8; font-size: 0.8rem; margin-top: 6px; letter-spacing: 1px; text-transform: uppercase;
    }

      display: inline-flex; align-items: center; gap: 10px; background: #25d366; color: #ffffff; font-weight
